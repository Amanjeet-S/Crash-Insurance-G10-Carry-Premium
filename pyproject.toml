[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qef-research"
version = "0.1.0"
description = "Reproducible research in quantitative economics and finance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "scipy==1.16.3",
    "pandas==2.3.3",
    "matplotlib==3.10.6",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
crosscheck = ["QuantLib==1.43"]

[project.urls]
Repository = "https://github.com/Amanjeet-S/Quantitative-Economics-Finance"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
