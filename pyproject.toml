[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crash-insurance-g10-carry-premium"
version = "0.1.0"
description = "Code for the paper Crash insurance and the G10 carry premium"
authors = [{ name = "Amanjeet Singh" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "scipy==1.16.3",
    "pandas==2.3.3",
    "matplotlib==3.10.6",
    "highspy==1.15.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
crosscheck = ["QuantLib==1.43", "arch==8.0.0", "statsmodels==0.14.5"]

[project.urls]
Repository = "https://github.com/Amanjeet-S/Crash-Insurance-G10-Carry-Premium"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
